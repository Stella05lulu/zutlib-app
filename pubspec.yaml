name: zutlib
description: Academic resource and borrowing management for Zambia University College of Technology.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  web: ^1.1.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.4
  # Study and due-date reminders scheduled on the phone (no server needed).
  # Pinned: 19.5.0 is the version the code in lib/services/reminders.dart
  # was written against (20.0 renamed its parameters).
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

# image 4.11 needs a newer archive than pub resolves here (decodeLazy is
# missing from archive 4.0.9). image is only used inside pdf/printing for the
# study guide download; 4.5.4 works with archive 4.0.x.
dependency_overrides:
  image: 4.5.4
