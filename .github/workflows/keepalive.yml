# Free Supabase projects pause after seven days without activity.
# This calls the beat() function twice a week (Monday and Thursday, 08:17
# Zambia time) using the PUBLIC anon key. beat() is the only thing that key
# is allowed to do (see supabase/migrations/0008_keepalive.sql), so no
# secret that bypasses row level security is stored in GitHub.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL        e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   the anon key from .env
name: keepalive

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the heartbeat
        run: |
          curl -sS -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/beat" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
